name: Android (APK)

# Compila e assina o APK do app Android (Trusted Web Activity). Roda sob demanda: o APK só
# muda quando muda o endereço do site, o ícone ou a versão do app Android (as telas vêm do site).
# Depois de rodar, baixe o artefato e publique em frontend/public/downloads/meu-orcamento.apk.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versão do app Android (ex.: 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Número da versão (inteiro, sempre maior que o anterior)"
        required: true
        default: "1"
      host:
        description: "Endereço do site (sem https://)"
        required: true
        default: "144-22-130-13.sslip.io"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            # Em PRs sem acesso aos segredos: chave temporária só para conferir que compila.
            keytool -genkeypair -storetype pkcs12 -keystore "$RUNNER_TEMP/release.p12" \
              -alias meu-orcamento -keyalg RSA -keysize 2048 -validity 1 \
              -storepass temporaria -keypass temporaria -dname "CN=Teste" -noprompt
            echo "KEYSTORE_PASSWORD=temporaria" >> "$GITHUB_ENV"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Compilar
        env:
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          VERSION_CODE: ${{ inputs.version_code || '1' }}
          TWA_HOST: ${{ inputs.host || '144-22-130-13.sslip.io' }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Impressão digital do certificado (para o assetlinks.json)
        run: keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" | grep "SHA256:"
      - uses: actions/upload-artifact@v4
        with:
          name: meu-orcamento-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
