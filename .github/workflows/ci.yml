name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # Os mesmos testes no banco de produção, mais as migrações do zero.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Criar bancos de teste
        run: |
          psql -h localhost -U ci -d ci -c "CREATE DATABASE testes"
          psql -h localhost -U ci -d ci -c "CREATE DATABASE migracoes"
      - name: Testes no PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/testes
        run: uv run pytest
      - name: Migrações (subir, conferir com os modelos, descer e subir de novo)
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/migracoes
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Sobe a stack de produção inteira (docker-compose.prod.yml) em https://localhost e testa
  # site, segurança, cadastro/login e backup + restauração. Ver deploy/scripts/smoke-test.sh.
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -yq age
      - run: bash deploy/scripts/smoke-test.sh

  # A VM da Oracle é ARM (Ampere): garante que as imagens constroem e importam nessa arquitetura.
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: API (build + import das dependências nativas)
        run: |
          docker buildx build --platform linux/arm64 --load -t api:arm64 ./backend
          docker run --rm --platform linux/arm64 api:arm64 \
            python -c "import argon2, cryptography, psycopg, app.main; print('ok', __import__('platform').machine())"
      - name: Backup
        run: docker buildx build --platform linux/arm64 ./deploy/backup
      - name: Caddy + frontend
        run: docker buildx build --platform linux/arm64 -f deploy/caddy/Dockerfile .

  # Usa o app pela interface como uma pessoa de verdade (persona com 9 meses de dados) e
  # audita a acessibilidade de todas as telas. Ver e2e/persona.py e e2e/acessibilidade.py.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+pysqlite:///${{ github.workspace }}/backend/e2e.db
      EMAIL_BACKEND: console
      SECRET_KEY: e2e-ci-somente-teste
      FRONTEND_URL: http://localhost:5173
      QA_CREDENTIALS: ${{ github.workspace }}/backend/e2e-cred.txt
      QA_OUT: ${{ github.workspace }}/e2e/saida
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar
        run: |
          (cd backend && uv sync)
          (cd frontend && npm ci)
          uv run --no-project --with playwright python -m playwright install --with-deps chromium
      - name: Subir API e site
        run: |
          cd backend
          uv run alembic upgrade head
          uv run python -m app.cli seed-demo --credentials-file "$QA_CREDENTIALS"
          nohup uv run uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          cd ../frontend
          API_PROXY_TARGET=http://127.0.0.1:8000 nohup npm run dev -- --clearScreen false > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:5173/ && curl -fsS -o /dev/null http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Persona (QA pela interface)
        run: uv run --no-project --with playwright --with pyotp python e2e/persona.py
      - name: Acessibilidade (axe, WCAG 2.1 AA)
        if: always()
        run: uv run --no-project --with playwright python e2e/acessibilidade.py
      - name: Logs dos servidores
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-prints
          path: e2e/saida
          retention-days: 7

  # Sobe o ambiente do Codespaces de verdade (devcontainer) e confere que API e site
  # continuam no ar depois da inicialização automática.
  codespaces:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            sleep 5
            curl -fsS -o /dev/null http://127.0.0.1:5173/ && echo "site ok"
            curl -fsS http://127.0.0.1:8000/api/health && echo " api ok"
            bash .devcontainer/start.sh --se-parado
