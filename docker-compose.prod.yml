# Produção. Uso (no servidor, na pasta do projeto):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Veja docs/DEPLOY.md.

name: meu-orcamento

include: [integrations/rtc/compose.yml]

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sem "ports": o banco só é acessível de dentro da rede do Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build: ./backend
    networks: [default, rtc]
    restart: unless-stopped
    env_file: .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FRONTEND_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      # Mensageria: conector do WhatsApp na rede interna (sem porta aberta para fora).
      MESSAGING_CONNECTOR_URL: http://whatsapp:3100
      RTC_REGULAR_URL: http://rtc-regular:8080
      RTC_SIMPLES_URL: http://rtc-simples:8082
      RTC_DANFSE_URL: http://rtc-danfse:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/db', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  # Tarefas diárias da aplicação (limpeza de sessões, links e eventos antigos).
  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "-m", "app.cli", "schedule"]
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # Mensageria: conector do WhatsApp Web (Node 24 + Baileys). Cada número conectado usa de
  # 30 a 80 MB; o teto de 8 GB protege o banco e a API. Credenciais ficam no Postgres.
  whatsapp:
    build: ./integrations/whatsapp
    restart: unless-stopped
    # Sem env_file de propósito: o conector recebe só o que usa (nenhum outro segredo do servidor).
    environment:
      HUB_API_URL: http://api:8000
      DATABASE_URL: "${MESSAGING_CONNECTOR_DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}"
      CONNECTOR_TOKEN: ${MESSAGING_CONNECTOR_TOKEN:-}
      WORKERS: "2"
      WORKER_MAX_OLD_SPACE_MB: "3072"
    mem_limit: 8g
    stop_grace_period: 15s
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # Backup diário do banco, criptografado com a chave pública "age" do dono.
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    env_file: .env.production
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
