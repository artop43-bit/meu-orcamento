# Ambiente de desenvolvimento. Motores fiscais sob demanda via `--profile rtc`.
include: [integrations/rtc/compose.yml]

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    networks: [default, rtc]
    env_file: .env
    # A cada .py salvo em app/ ou alembic/, atualiza o banco (migrações pendentes) e religa a
    # API. O --reload do uvicorn não rodava o alembic de novo, e o banco ficava atrás do código.
    command:
      - watchfiles
      - --filter
      - python
      - --target-type
      - command
      - sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000'
      - app
      - alembic
    environment:
      # Mensageria: conector do WhatsApp (serviço "whatsapp" abaixo). A chave vem do .env.
      MESSAGING_CONNECTOR_URL: http://whatsapp:3100
      RTC_REGULAR_URL: http://rtc-regular:8080
      RTC_SIMPLES_URL: http://rtc-simples:8082
      RTC_DANFSE_URL: http://rtc-danfse:8080
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Mensageria: conector do WhatsApp Web (Node 24 + Baileys), sem porta aberta no PC.
  # Religa sozinho quando um arquivo de src/ muda; as sessões voltam do banco sem novo QR.
  whatsapp:
    build: ./integrations/whatsapp
    environment:
      HUB_API_URL: http://backend:8000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CONNECTOR_TOKEN: ${MESSAGING_CONNECTOR_TOKEN:-}
      WORKERS: "2"
    # Checagem periódica (polling): o --watch-path nativo não detecta edições do Windows no Docker.
    command: ["node", "src/dev-watch.js"]
    volumes:
      - ./integrations/whatsapp/src:/app/src
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      # No Windows o Vite dentro do Docker não percebe as edições sem checagem periódica.
      VITE_USE_POLLING: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
