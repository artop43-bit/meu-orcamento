[project]
name = "meu-orcamento-api"
version = "0.1.0"
description = "API da plataforma Meu Orçamento"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.10.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "tzdata>=2026.5",
    "openpyxl>=3.1.5",
    "pillow>=11",
    "python-multipart>=0.0.20",
    "pywebpush>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Dicionário de termos: listas longas por linha ficam mais fáceis de manter.
"app/services/category_words.py" = ["E501"]
# Modelos de e-mail em HTML: linhas longas de estilos embutidos.
"app/services/notify.py" = ["E501"]

[tool.ruff.lint.isort]
# A pasta local "alembic/" não é o pacote alembic.
known-third-party = ["alembic"]
